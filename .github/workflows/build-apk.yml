name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "Checking Java version..."
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set." >&2
            exit 1
          fi

          JAVA_VER_STRING=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER_STRING"

          JAVA_MAJOR=$(echo "$JAVA_VER_STRING" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"

          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Unable to detect Java major version." >&2
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version is $JAVA_MAJOR, which is lower than the required Java 17." >&2
            exit 1
          fi
          echo "Java environment verified successfully (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "debug.keystore is missing. Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be created or found." >&2
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK output
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at: $EXPECTED_APK" >&2
            echo "Searching only inside app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK exists but is empty (0 bytes)." >&2
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: $EXPECTED_APK does not have the .apk extension." >&2; exit 1 ;;
          esac

          echo "Verified debug APK: $EXPECTED_APK"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "Error: APK source $APK_SOURCE not found." >&2
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"

          TEMP_RELEASE_DIR="${RUNNER_TEMP}/apk-release"
          mkdir -p "$TEMP_RELEASE_DIR"

          ASSET_FULL_PATH="${TEMP_RELEASE_DIR}/${ASSET_FILENAME}"
          cp "$APK_SOURCE" "$ASSET_FULL_PATH"

          if [ ! -s "$ASSET_FULL_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty at $ASSET_FULL_PATH" >&2
            exit 1
          fi

          echo "Prepared release asset: $ASSET_FULL_PATH"
          echo "asset_path=${ASSET_FULL_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH does not exist or is empty." >&2
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Release asset $ASSET_PATH is not an .apk file." >&2; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ### NEXTGEN AI — Automated Debug APK Build

          This is an automatically generated debug APK build created by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit:** \`${GITHUB_SHA}\`
          - **Build Artifact:** \`${ASSET_NAME}\`
          - **Environment:** Android Debug Build

          > **Notice:** This APK is intended for testing and verification only. It is not a production release for the Google Play Store and is signed using a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: $RELEASE_TAG and target: $GITHUB_SHA"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          PUBLISH_OUTCOME="${{ steps.publish_release.outcome }}"

          echo "=========================================================="
          echo "                 APK BUILD & RELEASE SUMMARY              "
          echo "=========================================================="

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "GitHub Release publishing SUCCEEDED."
            echo "Release Tag: $RELEASE_TAG"
            echo "Asset Filename: $ASSET_NAME"

            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            echo "Release URL: $RELEASE_URL"

            echo "### 🚀 Debug APK Build & Release Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was built and published to GitHub Releases:" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [View Release and Download APK]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Asset Filename:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "You can download the APK directly from the **Assets** section of the release page on your phone." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "*(The standard GitHub Actions artifact \`app-debug-apk\` is also preserved and available as a backup).* " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing did not complete successfully or was skipped."
            echo "The debug APK build and the Actions artifact upload both SUCCEEDED."
            echo "Actions artifact 'app-debug-apk' remains available for direct download from the workflow run."

            echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Notice)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Build:** Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Artifact Upload:** Succeeded (\`app-debug-apk\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **GitHub Release Publishing:** Notice / Incomplete" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK is safe and available under the **Artifacts** section of this GitHub Actions run as \`app-debug-apk\`." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "=========================================================="
